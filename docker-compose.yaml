services:
  influxdb-source:
    image: influxdb:1.8
    container_name: influxdb-source
    ports:
      - "18086:8086"  # Puerto externo para validar origen
    environment:
      - INFLUXDB_DB=telemetry
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - ./volumes/influxdb-source/data:/var/lib/influxdb
    profiles:
      - development
    networks:
      - backup-network

  influxdb-dest:
    image: influxdb:1.8
    container_name: influxdb-dest
    ports:
      - "19086:8086"  # Puerto externo para validar destino
    environment:
      - INFLUXDB_DB=telemetry
      - INFLUXDB_HTTP_AUTH_ENABLED=false
    volumes:
      - ./volumes/influxdb-dest/data:/var/lib/influxdb
    profiles:
      - development
    networks:
      - backup-network

  data-generator:
    image: python:3.11-slim
    container_name: data-generator
    depends_on:
      - influxdb-source
    volumes:
      - ./:/app
    working_dir: /app
    environment:
      - INFLUX_HOST=influxdb-source
      - INFLUX_PORT=8086
      - INFLUX_DB=telemetry
      - GENERATOR_BACKFILL_DAYS=7
      - GENERATOR_REALTIME_BATCH=25
      - LOG_LEVEL=INFO
      - LOG_HEARTBEAT_SEC=10
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "pip install --no-cache-dir influxdb faker &&
             python scripts/data_generator.py"
    profiles:
      - development
    networks:
      - backup-network

networks:
  backup-network:
    driver: bridge
    name: ${INFLUXDB_NETWORK:-influxdb-network}
